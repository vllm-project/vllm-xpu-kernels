# =============================================================================
# Default paged decode kernel configuration
# =============================================================================
# Covers the most active open-source models: Llama, Qwen, DeepSeek, Falcon,
# Starcoder2, Phi, VLM2Vec
#
# Model → config mapping:
#   Llama-2/3 (7B–70B), CodeLlama  → head_size=128, qgroup=8
#   Qwen2/2.5/3 (7B–235B)          → head_size=128, qgroup=8
#   DeepSeek-V2/V3/R1 (MLA heads)  → head_size=192, qgroup=8
#   Falcon-7B (MQA: 71 q / 1 kv)   → head_size=64,  qgroup=16
#   Starcoder2-3B (MQA)            → head_size=128, qgroup=16
#   Phi-4-MM / Phi3V variants      → head_size=96/128, qgroup=8
#
# Most models: causal=true, local=false, sink=false (standard autoregressive)
#
# Format: qgroup,headsize,pagesize,causal,local,sink
#
# NOTE on qgroup: the decode kernel tiles the GQA head-group across the grid,
# so qgroup is a packed-Q tile size, not a hard cap on num_heads_q/num_heads_kv.
# Ratios <= 8 use qgroup=8; ratios > 8 (including very large MQA ratios such as
# Falcon-7B's 71) use the qgroup=16 bucket and are split into ceil(ratio/16)
# work-groups.
#
# This config contains: 24 explicit entries (vs 384 full combinations)
# To enable sliding-window (Qwen2.5 / Llama-3.1 long context):
#   uncomment the local=true lines below.
# To cover Gemma-2 (head_size=256), add: 8,256,16,true,false,false etc.

# --- Llama / Qwen family (head_size=128) ------------------------------------
8,128,16,true,false,false
8,128,32,true,false,false
8,128,64,true,false,false
8,128,64,false,false,false
16,128,64,false,false,false

# Sliding window (Qwen2.5, Llama-3.1 long context) — uncomment if needed:
# 8,128,16,true,true,false
# 8,128,32,true,true,false
# 8,128,64,true,true,false

# Qwen/Qwen3-Next-80B-A3B-Instruct, Qwen/Qwen3-Next-80B-A3B-Thinking
8,256,64,false,false,false

