# =============================================================================
# Default chunk prefill kernel configuration
# =============================================================================
# Covers the most active open-source models: Llama, Qwen, DeepSeek
#
# Model → config mapping:
#   Llama-2/3 / Qwen2/2.5/3 → head_size=128, causal=true
#   DeepSeek-V2/V3/R1 (MLA) → head_size=192, causal=true
#
# Format: headsize,paged,causal,local,sink,lse
#
# This config generates a small subset of kernels (vs 216 full → ~97% reduction)
# To enable sliding-window, uncomment the local=true lines below.

# --- Llama / Qwen family (head_size=128) ------------------------------------
# paged KV cache (chunked decode/prefill with page table)
128,true,true,false,false,false
# paged KV cache, non-causal (mixed prefill/decode batches with is_causal=False)
128,true,false,false,false,false
# non-paged (initial prompt processing)
128,false,true,false,false,false
# non-paged with LSE output (chunked prefill state merging)
128,false,true,false,false,true

# Full FP8 attention (fp8 Q/K/V -> fp8 Q*K and P*V GEMMs), XE3 only.
# FP8 reuses these standard head_size=128 policy tuples (the fp8 datapath is
# selected at dispatch time, not via a separate config axis); it only requires
# block_size >= 32 so the P*V contraction tile is a multiple of the fp8 DPAS
# atom K (= 32). The non-causal variants below cover fp8 decode-style and
# non-causal prefill requests that the causal-only entries above do not.
128,true,false,false,false,false
128,false,false,false,false,false

# Full FP8 sliding-window (local) and attention-sink variants, XE3 only.
# Same head_size=128 K=32 policy (block_size >= 32). A causal sliding window is
# dispatched as a non-causal local mask: the kernel folds causality into the
# window (window_size_right=0, is_causal=false; see fmha_xe3.cpp), so the local
# tuple is causal=false. Attention sink adds a per-head learnable-sink logit
# whose softmax-denominator contribution gets the same +8 fp8 exponent offset
# as P (see chunk_prefill_epilogue.hpp).
128,true,false,true,false,false
128,true,true,false,true,false
# Non-causal paged attention sink (fp8 decode-style / non-causal prefill with
# s_aux but no causal mask, e.g. test_chunk_prefill_full_fp8 use_sink case).
128,true,false,false,true,false

# Sliding window — uncomment if needed:
# 128,false,true,true,false,false

# --- Wan2.2 / Diffusion models (head_size=128, non-causal) ------------------
# non-paged, non-causal (diffusion self/cross-attention, no KV cache)
128,false,false,false,false,false

# --- Paged with sink (PO UT coverage) ----------------------------------------
128,true,true,false,true,false
128,true,false,false,true,false

# --- Non-paged, non-causal with LSE (PO UT: test_varlen_with_softmax_lse) ----
128,false,false,false,false,true

# --- Head64 paged non-causal (PO UT: test_varlen_with_interleaved_paged_kv) --
64,true,false,false,false,false

# --- DeepSeek MLA latent heads (head_size=192) ------------------------------
192,true,true,false,false,false
192,false,true,false,false,false
192,false,true,false,false,true

